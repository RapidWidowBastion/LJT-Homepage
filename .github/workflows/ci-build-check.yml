name: Jekyll build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: List built HTML pages
        run: find _site -name "*.html" | sort
      - name: Verify key content rendered
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          grep -q "Junteng Liu" _site/index.html
          grep -q "SynLogic" _site/publications/index.html
          echo "Build content checks passed."
